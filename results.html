<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Allnspyre | Your 7 picks</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WPQTZYR6MG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WPQTZYR6MG');
  </script>
  <style>
    :root{
      --bg:#faf7f2;
      --card:#faf7f2;
      --text:#1a1208;
      --muted:#8a6840;
      --gold:#b8966e;
      --gold-light:#d4b896;
      --gold-dark:#8a6840;
      --line:#d4b896;
      --red:#c0392b;
      --danger:#c62828;
      --radius:18px;
      --shadow:0 14px 40px rgba(180,140,80,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      background:#faf7f2;
    }

    .wrap{max-width:920px;margin:0 auto;padding:26px 16px 80px;}

    /* TOPBAR */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      gap:12px;flex-wrap:wrap;margin-bottom:20px;
    }
    .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
    .chip{
      font-size:11px;color:var(--gold-dark);
      border:1px solid var(--gold-light);
      background:rgba(212,184,150,.08);
      padding:5px 10px;border-radius:4px;
      white-space:nowrap;font-style:italic;letter-spacing:.02em;
    }
    .chip--gps{
      background:rgba(202,138,4,.08);
      border-color:rgba(202,138,4,.3);
      color:#92400e;
    }
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .btn{
      border:1px solid var(--line);background:#fff;
      padding:8px 14px;border-radius:999px;cursor:pointer;
      font-size:13px;line-height:1;
      text-decoration:none;display:inline-flex;align-items:center;gap:6px;
      color:var(--text);user-select:none;
      transition:transform .15s,filter .15s,box-shadow .15s;
      box-shadow:0 2px 8px rgba(180,140,80,.08);
    }
    .btn:hover{filter:brightness(.97);transform:translateY(-1px);box-shadow:0 4px 14px rgba(180,140,80,.15);}
    .btn:active{transform:translateY(0);}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

    /* HEADER */
    .page-header{text-align:center;margin-bottom:20px;position:relative;}
    .page-header__lantern-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
    .page-header__line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-light));}
    .page-header__line-r{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-light),transparent);}
    h1{
      font-family:ui-serif,Georgia,"Times New Roman",Times,serif;
      font-size:52px;letter-spacing:-.03em;
      margin:10px 0 6px;line-height:1.0;
      color:var(--text);font-weight:300;
    }
    .sub{color:var(--muted);margin:0 0 12px;font-size:15px;font-style:italic;}

    /* PROGRESS */
    .progress{
      display:flex;justify-content:center;gap:12px;align-items:center;
      color:var(--muted);font-size:13px;margin-top:10px;flex-wrap:wrap;
    }
    .dotbar{display:flex;gap:6px;align-items:center;}
    .dot{width:6px;height:6px;border-radius:999px;background:var(--gold-light);}
    .dot.active{background:var(--gold-dark);}
    .hint{color:var(--muted);font-size:12px;}
    .kbd{font-size:12px;color:var(--muted);border:1px solid var(--gold-light);background:#fff;padding:4px 8px;border-radius:6px;}

    /* ALERT */
    .alert{
      border:1px solid #f2b8b5;background:#fff3f3;color:var(--danger);
      padding:14px 16px;border-radius:14px;margin:18px auto 0;
      display:none;max-width:720px;
    }

    .stage{margin-top:20px;display:flex;justify-content:center;}

    /* CARD */
    .card{
      width:min(720px,100%);
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--card);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .card::after{
      content:"";position:absolute;top:-30px;right:-30px;
      width:140px;height:140px;border-radius:50%;
      border:1px solid var(--gold);opacity:.07;pointer-events:none;
      box-shadow:0 0 0 20px rgba(184,150,110,.04),0 0 0 40px rgba(184,150,110,.02);
    }

    /* 提灯ライン */
    .card-lantern-row{display:flex;align-items:center;gap:8px;padding:16px 20px 0;}
    .card-lantern-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-light));}
    .card-lantern-line-r{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-light),transparent);}

    .hero{position:relative;width:100%;height:200px;background:#f5f0e8;margin-top:12px;}
    .hero img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05);}
    .hero .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,0) 55%,rgba(0,0,0,.08));pointer-events:none;}

    .body{padding:18px 22px 16px;position:relative;}

    .titleRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
    .card-meta{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;font-weight:500;}
    .name{font-family:ui-serif,Georgia,"Times New Roman",Times,serif;font-size:32px;margin:0;line-height:1.1;letter-spacing:-.02em;color:var(--text);font-weight:300;}
    .pill-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .mascot{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--gold);object-fit:cover;object-position:center top;}
    .pill{border:1px solid var(--gold-light);background:transparent;color:var(--gold-dark);font-size:11px;padding:5px 10px;border-radius:999px;white-space:nowrap;font-weight:500;letter-spacing:.04em;}

    .card-divider{height:1px;background:linear-gradient(90deg,var(--gold),var(--gold-light) 40%,transparent);margin:14px 0;opacity:.6;}

    .section{margin-top:14px;}
    .label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 7px;font-weight:500;}
    .copy{margin:0;font-size:13.5px;line-height:1.85;color:var(--text);font-weight:400;}
    .copy strong{font-weight:650}

    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
    .tag{font-size:11px;color:var(--gold-dark);font-style:italic;letter-spacing:.02em;border:1px solid var(--gold-light);background:transparent;padding:5px 12px;border-radius:4px;}

    .footer{
      padding:13px 22px;border-top:1px solid var(--gold-light);
      display:flex;justify-content:space-between;align-items:center;
      gap:10px;flex-wrap:wrap;background:#f5f0e8;
    }
    .maps-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;letter-spacing:.04em;text-decoration:none;color:var(--gold-dark);border:none;background:none;cursor:pointer;padding:0;transition:opacity .15s;}
    .maps-btn:hover{opacity:.7;}
    .counter{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.06em;}

    /* SKELETON */
    .skeleton{width:min(720px,100%);height:480px;border:1px solid var(--gold-light);border-radius:var(--radius);background:linear-gradient(90deg,#faf7f2 0%,#f0e8d8 50%,#faf7f2 100%);background-size:200% 200%;animation:shimmer 1.4s infinite linear;box-shadow:var(--shadow);}
    @keyframes shimmer{0%{background-position:0% 0%}100%{background-position:100% 0%}}

    @media(max-width:720px){h1{font-size:38px}.hero{height:170px}.name{font-size:26px}}
    @media(max-width:420px){h1{font-size:32px}.hero{height:150px}.body{padding:14px 16px}.footer{padding:12px 16px}}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="chips" id="chips">
        <span class="chip">PLAN: —</span>
        <span class="chip">PREFS: —</span>
        <span class="chip">AREAS: —</span>
      </div>
      <div class="actions">
        <button class="btn" id="prevBtn">←</button>
        <button class="btn" id="nextBtn">→</button>
        <button class="btn" id="retryBtn">Retry</button>
        <button class="btn" id="backBtn">← Back</button>
      </div>
    </div>

    <div class="page-header">
      <div class="page-header__lantern-row">
        <div class="page-header__line"></div>
        <svg width="22" height="28" viewBox="0 0 22 28" fill="none">
          <line x1="11" y1="0" x2="11" y2="3.5" stroke="#b8966e" stroke-width="1.2"/>
          <rect x="2" y="3.5" width="18" height="2.2" rx="1.1" fill="#b8966e"/>
          <ellipse cx="11" cy="15" rx="9" ry="10" fill="#c0392b"/>
          <ellipse cx="11" cy="15" rx="5" ry="6" fill="#e74c3c" opacity=".5"/>
          <ellipse cx="11" cy="14" rx="3" ry="3.5" fill="#ff6b6b" opacity=".3"/>
          <line x1="3.5" y1="10" x2="18.5" y2="10" stroke="#8b1a1a" stroke-width=".8" opacity=".7"/>
          <line x1="2" y1="15" x2="20" y2="15" stroke="#8b1a1a" stroke-width=".8" opacity=".7"/>
          <line x1="3.5" y1="20" x2="18.5" y2="20" stroke="#8b1a1a" stroke-width=".8" opacity=".7"/>
          <ellipse cx="11" cy="15" rx="9" ry="10" fill="none" stroke="#b8966e" stroke-width="1"/>
          <rect x="2" y="24.3" width="18" height="2.2" rx="1.1" fill="#b8966e"/>
          <line x1="11" y1="26.5" x2="11" y2="28" stroke="#b8966e" stroke-width="1.2"/>
        </svg>
        <div class="page-header__line-r"></div>
      </div>
      <h1>Your 7 picks.</h1>
      <p class="sub">Where locals actually eat — before the world finds out.</p>
    </div>

    <div class="progress">
      <span id="progressText">—</span>
      <span class="dotbar" id="dotbar"></span>
      <span class="hint">Use <span class="kbd">←</span> <span class="kbd">→</span> / swipe</span>
    </div>

    <div class="alert" id="alertBox">
      <strong>Failed</strong>
      <div id="alertMsg" style="margin-top:6px;"></div>
      <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
        <a class="btn" id="alertBackBtn" href="/hearing_area.html">Go back</a>
        <button class="btn" id="useLastBtn" style="display:none;">Use last successful session</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="skeleton"></div>
    </div>
  </div>

<script>
  const stage       = document.getElementById("stage");
  const alertBox    = document.getElementById("alertBox");
  const alertMsg    = document.getElementById("alertMsg");
  const alertBackBtn= document.getElementById("alertBackBtn");
  const chips       = document.getElementById("chips");
  const retryBtn    = document.getElementById("retryBtn");
  const backBtn     = document.getElementById("backBtn");
  const prevBtn     = document.getElementById("prevBtn");
  const nextBtn     = document.getElementById("nextBtn");
  const useLastBtn  = document.getElementById("useLastBtn");
  const progressText= document.getElementById("progressText");
  const dotbar      = document.getElementById("dotbar");

  let shopsCache = [];
  let idx = 0;

  // URLパラメータからsourceを取得（hearing_gps or hearing_area）
  const urlParams = new URL(location.href).searchParams;
  const source = urlParams.get("source") || "hearing_area";
  const isGps = source === "hearing_gps";

  // Backボタンのリンク先をsourceに応じて切り替え
  const backHref = isGps
    ? "https://allnspyre-api.vercel.app/hearing_gps.html"
    : `https://allnspyre-api.vercel.app/hearing_area.html?plan=${urlParams.get("plan") || "explorer"}`;
  backBtn.addEventListener("click", () => { location.href = backHref; });
  alertBackBtn.href = backHref;

  const MASCOT_URL = "https://storage.googleapis.com/studio-design-asset-files/projects/xNWY906NWl/s-400x400_webp_85e0c86b-9fdd-48ac-b84b-0d12911b64a0.png";
  const LANTERN_SMALL = `<svg width="10" height="13" viewBox="0 0 10 13" fill="none">
    <rect x="1" y="1" width="8" height="1.2" rx="0.6" fill="#d4b896"/>
    <ellipse cx="5" cy="7" rx="4" ry="4.5" fill="#c0392b" opacity=".8"/>
    <ellipse cx="5" cy="7" rx="4" ry="4.5" fill="none" stroke="#b8966e" stroke-width=".7"/>
    <rect x="1" y="10.8" width="8" height="1.2" rx="0.6" fill="#d4b896"/>
  </svg>`;

  function gaSafeEvent(name, params){ try{ if(typeof window.gtag==="function") window.gtag("event",name,params||{}); }catch(_){} }
  function setError(message){ alertMsg.textContent=message||"Unknown error"; alertBox.style.display="block"; }
  function clearError(){ alertBox.style.display="none"; alertMsg.textContent=""; }
  function setLoading(){
    stage.innerHTML=`<div class="skeleton"></div>`;
    if(progressText) progressText.textContent="—";
    if(dotbar) dotbar.innerHTML="";
    prevBtn.disabled=true; nextBtn.disabled=true;
  }

  function setChips(plan, prefs, areas){
    // GPS版は「📍 Near you」を表示
    const areasLabel = isGps ? "📍 Near you" : (areas || "—");
    const areaClass = isGps ? "chip chip--gps" : "chip";
    chips.innerHTML=`
      <span class="chip">PLAN: ${plan||"—"}</span>
      <span class="chip">PREFS: ${prefs||"—"}</span>
      <span class="${areaClass}">AREA: ${areasLabel}</span>
      ${isGps ? `<span class="chip chip--gps">📍 GPS</span>` : ""}
    `;
  }

  function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g,(m)=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m])); }
  function toArray(v){
    if(Array.isArray(v)) return v.filter(Boolean);
    if(typeof v==="string"&&v.trim()) return v.split(",").map(s=>s.trim()).filter(Boolean);
    return [];
  }
  function titleCase(s){ const x=(s??"").toString().trim(); if(!x) return ""; return x.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
  function buildTags(shop){
    const tier=Array.isArray(shop.tier)?shop.tier:(shop.tier?[shop.tier]:[]);
    const slot=shop.time_slot?[shop.time_slot]:[];
    const bw=toArray(shop.best_with);
    const bv=toArray(shop.best_vibe);
    const tags=[...tier,...slot,...bw,...bv].filter(Boolean);
    return [...new Set(tags)].slice(0,10);
  }
  function getNote(shop){
    const n=(shop.note_en||"").toString().trim(); if(n) return n;
    const sd2=(shop["short_desc 2"]||shop.short_desc_2||shop.short_desc2||"").toString().trim(); if(sd2) return sd2;
    return (shop.short_desc||"").toString().trim();
  }
  function getWhy(shop){
    const w=(shop.why_en||"").toString().trim(); if(w) return w;
    const tier=Array.isArray(shop.tier)?shop.tier:(shop.tier?[shop.tier]:[]);
    const slot=(shop.time_slot||"").toString().trim();
    const bw=toArray(shop.best_with); const bv=toArray(shop.best_vibe);
    const lines=[];
    if(slot) lines.push(`Best time: ${titleCase(slot)}.`);
    if(bw.length) lines.push(`Best with: ${bw.slice(0,3).map(titleCase).join(", ")}.`);
    if(bv.length) lines.push(`Vibe: ${bv.slice(0,3).map(titleCase).join(", ")}.`);
    if(tier.length) lines.push(`Tier: ${tier.map(titleCase).join(", ")}.`);
    return lines.join(" ");
  }
  function mapsUrlFor(shop){
    const q=encodeURIComponent(`${shop.shop_name||shop.shop||""} ${shop.area_detail||shop.area_group||""}`.trim());
    return `https://www.google.com/maps/search/?api=1&query=${q}`;
  }

  function cardHtml(shop){
    const name=escapeHtml(shop.shop_name||shop.shop||"Untitled");
    const area=escapeHtml(shop.area_group||"");
    const detail=escapeHtml(shop.area_detail||"");
    const tags=buildTags(shop);
    const why=escapeHtml(getWhy(shop));
    const note=escapeHtml(getNote(shop));
    const hasImg=!!(shop.photo_url||shop.image_url||shop.image);
    const imgUrl=escapeHtml(shop.photo_url||shop.image_url||shop.image||"");
    const mapsUrl=mapsUrlFor(shop);
    const total=shopsCache.length;
    return `
      <article class="card" aria-label="result-card">
        <div class="card-lantern-row">
          <div class="card-lantern-line"></div>
          <svg width="18" height="22" viewBox="0 0 18 22" fill="none">
            <line x1="9" y1="0" x2="9" y2="2.8" stroke="#b8966e" stroke-width="1"/>
            <rect x="1.5" y="2.8" width="15" height="1.8" rx=".9" fill="#b8966e"/>
            <ellipse cx="9" cy="12" rx="7.5" ry="8.5" fill="#c0392b"/>
            <ellipse cx="9" cy="12" rx="4" ry="5" fill="#e74c3c" opacity=".5"/>
            <ellipse cx="9" cy="11" rx="2.5" ry="3" fill="#ff6b6b" opacity=".3"/>
            <line x1="3" y1="8" x2="15" y2="8" stroke="#8b1a1a" stroke-width=".7" opacity=".7"/>
            <line x1="1.5" y1="12" x2="16.5" y2="12" stroke="#8b1a1a" stroke-width=".7" opacity=".7"/>
            <line x1="3" y1="16" x2="15" y2="16" stroke="#8b1a1a" stroke-width=".7" opacity=".7"/>
            <ellipse cx="9" cy="12" rx="7.5" ry="8.5" fill="none" stroke="#b8966e" stroke-width=".9"/>
            <rect x="1.5" y="19.4" width="15" height="1.8" rx=".9" fill="#b8966e"/>
            <line x1="9" y1="21.2" x2="9" y2="22" stroke="#b8966e" stroke-width="1"/>
          </svg>
          <div class="card-lantern-line-r"></div>
        </div>
        ${hasImg?`<div class="hero"><img src="${imgUrl}" alt="${name}" loading="lazy"><div class="overlay"></div></div>`:""}
        <div class="body">
          <div class="titleRow">
            <div>
              <p class="card-meta">${area}${detail?" / "+detail:""}</p>
              <h2 class="name">${name}</h2>
            </div>
            <div class="pill-wrap">
              <img class="mascot" src="${MASCOT_URL}" alt="guide"/>
              <span class="pill" aria-label="card-counter">${idx+1} / ${total}</span>
            </div>
          </div>
          <div class="card-divider"></div>
          <div class="section">
            <p class="label">Why this pick</p>
            <p class="copy">${why||"Selected to match your moment."}</p>
          </div>
          <div class="section">
            <p class="label">Artisan note</p>
            <p class="copy">${note||"—"}</p>
            <div class="tags" aria-label="tags">
              ${tags.map(t=>`<span class="tag">${escapeHtml(titleCase(t))}</span>`).join("")}
            </div>
          </div>
        </div>
        <div class="footer">
          <a class="maps-btn" href="${mapsUrl}" target="_blank" rel="noopener">Open in Google Maps →</a>
          <div class="counter">${LANTERN_SMALL} ${idx+1} / ${total} ${LANTERN_SMALL}</div>
        </div>
      </article>
    `;
  }

  function renderDots(){ if(!dotbar) return; dotbar.innerHTML=shopsCache.map((_,i)=>`<span class="dot ${i===idx?"active":""}"></span>`).join(""); }
  function render(){
    if(!shopsCache.length){ stage.innerHTML=""; setError("No shops returned."); if(progressText) progressText.textContent="0 / 0"; if(dotbar) dotbar.innerHTML=""; prevBtn.disabled=true; nextBtn.disabled=true; return; }
    stage.innerHTML=cardHtml(shopsCache[idx]);
    const total=shopsCache.length;
    if(progressText) progressText.textContent=`${idx+1} / ${total}`;
    renderDots(); prevBtn.disabled=(idx===0); nextBtn.disabled=(idx===total-1);
  }
  function next(){ if(idx<shopsCache.length-1){ idx++; render(); } }
  function prev(){ if(idx>0){ idx--; render(); } }

  function getSessionIdFromUrl(){ return new URL(location.href).searchParams.get("session_id"); }
  function setSessionIdInUrl(sessionId){ const u=new URL(location.href); u.searchParams.set("session_id",sessionId); history.replaceState({},"",u.toString()); }

  async function load(){
    clearError(); setLoading();
    let sessionId=getSessionIdFromUrl();
    if(!sessionId){
      const last=localStorage.getItem("last_session_id")||"";
      if(last){ useLastBtn.style.display="inline-flex"; setError("Missing session_id. You can use the last successful session, or go back."); }
      else{ setError("Missing session_id. Please complete checkout and return to this page automatically."); }
      stage.innerHTML=""; setChips("—","—","—"); return;
    }
    try{
      const res=await fetch(`/api/results?session_id=${encodeURIComponent(sessionId)}`);
      const data=await res.json().catch(()=>({}));
      if(!res.ok||!data.ok){ stage.innerHTML=""; setChips("—","—","—"); setError(data.error||`results failed (${res.status})`); return; }
      localStorage.setItem("last_session_id",sessionId);
      const plan=data.plan||"—";
      const prefs=data.who?data.who:"—";
      const areas=Array.isArray(data.shops)?(data.shops.map(s=>s.area_group).filter(Boolean).slice(0,4).join(" / ")||"—"):"—";
      setChips(plan,prefs,areas);
      const shops=Array.isArray(data.shops)?data.shops:[];
      if(shops.length===0){ stage.innerHTML=""; setError("No shops returned."); return; }
      shopsCache=shops; idx=0; render();
      try{
        const onceKey=`ga_view_results_sent_${sessionId}`;
        if(!sessionStorage.getItem(onceKey)){
          const areasCount=new Set(shops.map(s=>s.area_group).filter(Boolean)).size||undefined;
          gaSafeEvent("view_results",{ session_id:sessionId, plan, shops_count:shops.length, areas_count:areasCount, source });
          sessionStorage.setItem(onceKey,"1");
        }
      }catch(_){}
    }catch(e){ stage.innerHTML=""; setChips("—","—","—"); setError("Network or server error. Check Vercel Runtime Logs."); }
  }

  retryBtn.addEventListener("click",load);
  nextBtn.addEventListener("click",next);
  prevBtn.addEventListener("click",prev);
  useLastBtn.addEventListener("click",()=>{
    const last=localStorage.getItem("last_session_id")||"";
    if(!last) return;
    setSessionIdInUrl(last); useLastBtn.style.display="none"; load();
  });

  window.addEventListener("keydown",(e)=>{ if(e.key==="ArrowRight") next(); if(e.key==="ArrowLeft") prev(); });

  let startX=null;
  stage.addEventListener("touchstart",(e)=>{ startX=e.touches?.[0]?.clientX??null; },{passive:true});
  stage.addEventListener("touchend",(e)=>{
    if(startX===null) return;
    const endX=e.changedTouches?.[0]?.clientX??startX;
    const dx=endX-startX;
    if(Math.abs(dx)>40){ if(dx<0) next(); else prev(); }
    startX=null;
  },{passive:true});

  load();
</script>
</body>
</html>
